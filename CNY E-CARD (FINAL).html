<html>

<head>
    <title>CNY E-Card</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Ma+Shan+Zheng&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #4f1010;
            flex-direction: column;
            text-align: center;
        }

        #a {
            color: #e1c59f;
            font-family: "Inknut Antiqua", serif;
            font-weight: 600;
            font-style: normal;
            font-size: 30px;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.614);
        }

        #b {
            color: #dca38e;
            font-family: "Ma Shan Zheng", serif;
            font-weight: 500;
            font-style: normal;
            font-size: 42px;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.728);
        }

        /* Spring Couplets */

        .spring-couplet {
            position: fixed;
            top: 15%;
            width: 120px;
            height: 520px;
        }

        .leftCouplet {
            left: 120px;
        }

        .rightCouplet {
            right: 120px;
        }

        /* Emoji container in horizontal layout */
        .emoji-container {
            display: flex;
            gap: 10px;
            /* Space between emojis */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            width: fit-content;
            margin-top: 10px;
            display: none;
            /* Initially hidden */
        }

        .emoji-container span {
            font-size: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .emoji-container span:hover {
            transform: scale(1.2);
        }

        /* Angpao Container */
        .angpao-container {
            position: relative;
            width: 300px;
            height: 400px;
            cursor: pointer;
        }

        /* Angpao Body */
        .angpao {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #CC232A;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.8s ease-in-out;
            overflow: hidden;
        }

        /* Angpao Flap */
        .flap {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100px;
            background: #A3262A;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transition: transform 0.5s ease-in-out;
        }

        /* Angpao Body Content */
        .body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 300px;
            background: #CC232A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Chinese Character */
        .chinese-character {
            font-size: 80px;
            font-weight: bold;
            color: gold;
            font-family: 'KaiTi', serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Angpao Animation */
        .angpao.open .flap {
            transform: rotateX(180deg);
        }

        /* Message Card */
        .message-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: #FFF8DC;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .message-card.visible {
            opacity: 1;
        }

        .message-card textarea {
            width: 150px;
            height: 100px;
            border: none;
            resize: none;
            text-align: center;
            font-size: 14px;
            padding: 5px;
        }

        .message-card button {
            margin-top: 10px;
            padding: 5px 10px;
            background: #D32F2F;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .message-card button:hover {
            background: #B71C1C;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .gif-option {
            width: 100px;
            cursor: pointer;
            margin: 10px;
        }

        /* Share on Social Media Button */

        .share button {
            margin-top: 20px;
            padding: 8px 20px;
            background-color: #be3f3f;
            font-family: "Libre Bodoni", serif;
            font-size: 15px;
            font-weight: bolder;
            color: #f0d5d6;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .share button:hover {
            background-color: #F2888B;
        }

        /* Share on Email Button */

        .email button {
            margin-top: 20px;
            padding: 6px 20px;
            background-color: #cb6464;
            font-family: "Libre Bodoni", serif;
            font-size: 15px;
            font-weight: bolder;
            color: #f0d5d6;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .email button:hover {
            background-color: #b29200;
        }

        /*Fireworks*/

        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        .fw {
            position: absolute;
            width: 4px;
            height: 10px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
            opacity: 1;
        }

        @keyframes explode {
            100% {
                transform: translate(var(--x), var(--y));
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <h1 id="a">HAPPY CHINESE NEW YEAR</h1><br>
    <h1 id="b">新 年 快 乐</h1><br><br>

    <!-- Spring Couplets -->
    <img src="Left spring couplet.png" alt="Left Spring Couplet" class="spring-couplet leftCouplet">
    <img src="Right spring couplet.png" alt="Right Spring Couplet" class="spring-couplet rightCouplet">

    <!-- Background Music -->
    <audio id="backgroundMusic" loop>
        <source src="cnysongs.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <!-- Angpao-style Envelope -->
    <div class="angpao-container" onclick="openAngpao()">
        <div class="angpao">
            <div class="flap"></div>
            <div class="body">
                <div class="chinese-character">福</div>
            </div>
        </div>

        <div class="message-card">
            <textarea id="customMessage"
                placeholder="Type your message here...">Gong Xi Fa Cai! May wealth and happiness be with you!</textarea>

            <!-- Emoji Picker -->
            <span id="emojiPicker" style="font-size:25px; cursor: pointer;" onclick="enableEmojiPicker()">😊 🎉
                🏮</span>

            <button onclick="saveMessage(event)">Save</button>

            <!-- Emoji Selection List (Now in Horizontal Layout) -->
            <div id="emojiList" class="emoji-container">
                <span onclick="selectEmoji('😊')">😊</span>
                <span onclick="selectEmoji('🥳')">🥳</span>
                <span onclick="selectEmoji('❤️')">❤️</span>
                <span onclick="selectEmoji('🎉')">🎉</span>
                <span onclick="selectEmoji('🏮')">🏮</span>
                <span onclick="selectEmoji('🎁')">🎁</span>
                <span onclick="selectEmoji('🥢')">🥢</span>
                <span onclick="selectEmoji('🍲')">🍲</span>
                <span onclick="selectEmoji('🎈')">🎈</span>
                <span onclick="selectEmoji('🎊')">🎊</span>
                <span onclick="selectEmoji('🎇')">🎇</span>
                <span onclick="selectEmoji('🌅')">🌅</span>
                <span onclick="selectEmoji('💰')">💰</span>
                <span onclick="selectEmoji('🥮')">🥮</span>
                <span onclick="selectEmoji('🀄')">🀄</span>
                <span onclick="selectEmoji('🧨')">🧨</span>

            </div>
        </div>
    </div>


    <!-- Share Button -->
    <div class="share">
        <button onclick="showGifModal('social')">SHARE ON SOCIAL MEDIA</button>
    </div>

    <!-- Share Email Button -->
    <div class="email">
        <button onclick="showGifModal('email')">SHARE VIA EMAIL</button>
    </div>

    <!-- GIF Modal -->
    <div id="gifModal" class="modal">
        <h3>Select a GIF</h3>
        <img class="gif-option" src="CNY1.gif" onclick="shareGif(1)">
        <img class="gif-option" src="CNY2.gif" onclick="shareGif(2)">
        <img class="gif-option" src="CNY3.gif" onclick="shareGif(3)">

        <br>
        <button onclick="closeModal()">Cancel</button>
    </div>



    <script>
        function enableEmojiPicker() {
            const emojiList = document.getElementById("emojiList");
            emojiList.style.display = (emojiList.style.display === "none" || emojiList.style.display === "") ? "flex" : "none";
        }

        function selectEmoji(emoji) {
            const messageInput = document.getElementById("customMessage");
            messageInput.value += " " + emoji;
        }

        function openAngpao() {
            const envelope = document.querySelector('.angpao');
            const messageCard = document.querySelector('.message-card');
            envelope.classList.add('open');
            messageCard.classList.add('visible');

            // Play background music when the envelope is opened
            const music = document.getElementById("backgroundMusic");
            if (music.paused) {
                music.play();
            }
        }

        function saveMessage(event) {
            event.stopPropagation(); // Prevent triggering the envelope animation
            const message = document.getElementById("customMessage").value;
            alert("Message saved: " + message);
        }
        function sendEmail() {
            const userMessage = document.getElementById("customMessage").value;
            const emailSubject = "A Special Chinese New Year Greeting for You!";
            const gifLink = "https://media.giphy.com/media/tX7C0ijFDBgHVjXzOf/giphy.gif";
            const mailtoLink = `mailto:?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(userMessage)}%0A%0A${encodeURIComponent(gifLink)}`;
            window.location.href = mailtoLink;
        }

        function shareCard() {
            const message = encodeURIComponent(document.getElementById("customMessage").value);
            const gifLink = "https://media.giphy.com/media/tX7C0ijFDBgHVjXzOf/giphy.gif";
            const shareLink = "https://twitter.com/intent/tweet?text=" + message + "%0A" + gifLink;
            window.open(shareLink, "_blank");
        }

        function showGifModal(type) {
            const modal = document.getElementById("gifModal");
            modal.style.display = "block";
            modal.setAttribute('data-type', type);  // Track the sharing type (social or email)
        }

        function closeModal() {
            const modal = document.getElementById("gifModal");
            modal.style.display = "none";
        }

        function share(gifNumber) {
            // Define GIF links (replace with actual Giphy links)
            const gifLinks = [
                "https://media.giphy.com/media/uAGdnFBTGY7ROUXMtw/giphy.gif", // GIF 1
                "https://media.giphy.com/media/10zoQzrU2mE7uxISVY/giphy.gif", // GIF 2
                "https://media.giphy.com/media/OmpDwU5ACX38jYJ6lU/giphy.gif"  // GIF 3
            ];

            const selectedGif = gifLinks[gifNumber - 1]; // Get the selected GIF link
            const shareText = encodeURIComponent("Happy Chinese New Year! 🎉 Check out this GIF: ");
            const shareUrl = encodeURIComponent(selectedGif);


        }

        function shareGif(gifNumber) {
            const modal = document.getElementById("gifModal");
            const type = modal.getAttribute('data-type');
            const message = encodeURIComponent(document.getElementById("customMessage").value || "Happy Chinese New Year! 🎉🧧");

            // Corrected GIF links mapping
            const gifLinks = {
                1: "https://media.giphy.com/media/uAGdnFBTGY7ROUXMtw/giphy.gif",
                2: "https://media.giphy.com/media/10zoQzrU2mE7uxISVY/giphy.gif",
                3: "https://media.giphy.com/media/OmpDwU5ACX38jYJ6lU/giphy.gif"
            };

            const gifUrl = gifLinks[gifNumber]; // Directly get the URL without encoding here

            if (!gifUrl) {
                alert("Invalid GIF selection");
                return;
            }

            if (type === 'social') {
                // Share to Twitter
                const shareLink = `https://twitter.com/intent/tweet?text=${message}&url=${encodeURIComponent(gifUrl)}`;
                window.open(shareLink, "_blank");
            } else if (type === 'email') {
                // Share via Email
                const emailSubject = encodeURIComponent("A Special Chinese New Year Greeting for You!");
                const emailBody = `${message}%0A%0A${gifUrl}`;
                const mailtoLink = `mailto:?subject=${emailSubject}&body=${emailBody}`;
                window.location.href = mailtoLink;
            }

            closeModal();
        }



        const colors = ["red", "yellow", "blue", "lime", "cyan", "magenta", "orange", "pink"];

        setInterval(() => {
            let x = Math.random() * innerWidth, y = Math.random() * innerHeight * 0.5;
            for (let i = 0; i < 20; i++) {
                let p = document.createElement("div");
                p.className = "fw";
                p.style.left = `${x}px`; p.style.top = `${y}px`;
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                let a = Math.random() * 6.28, d = Math.random() * 120 + 40;
                p.style.setProperty("--x", `${Math.cos(a) * d}px`);
                p.style.setProperty("--y", `${Math.sin(a) * d}px`);
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }, 300);

    </script>

</body>

</html>
